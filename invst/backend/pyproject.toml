[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invst"
version = "0.1.0"
description = "Personal investment decision-support tool for Indian equities (NSE/BSE, Nifty 500)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mandeep" }
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "yfinance>=0.2.31",
    "requests>=2.31",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "streamlit>=1.30",
    "plotly>=5.18",
    "weasyprint>=60",
    "lightgbm>=4.1",
    "transformers>=4.36",
    "torch>=2.1",
    "scikit-learn>=1.4",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.9",
    "mypy>=1.8",
    "ipython>=8.18",
    "jupyter>=1.0",
    "pre-commit>=3.6",
]

[project.scripts]
invst = "invst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["invst"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
